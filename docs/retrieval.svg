<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<rect width="900" height="330" rx="14" fill="#ffffff"/>
<rect width="900" height="330" rx="14" fill="none" stroke="#e2e8f0"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
<marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
<marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
</defs>
<text x="24" y="34" font-size="16" font-weight="700" fill="#1f2933">Hybrid schema retrieval</text>
<text x="24" y="54" font-size="12" fill="#64748b">Two rankings, fused, then reranked - retrieval/search.py</text>
<rect x="40" y="100" width="150" height="46" rx="9" fill="#dbeafe" stroke="#2563eb"/>
<text x="115.0" y="119.0" text-anchor="middle" font-size="13" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#1f2933">Question</text>
<text x="115.0" y="136.0" text-anchor="middle" font-size="10.5" fill="#64748b">"top customers?"</text>
<rect x="250" y="70" width="180" height="46" rx="9" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="340.0" y="89.0" text-anchor="middle" font-size="13" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#1f2933">BM25</text>
<text x="340.0" y="106.0" text-anchor="middle" font-size="10.5" fill="#64748b">exact table names</text>
<rect x="250" y="138" width="180" height="46" rx="9" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="340.0" y="157.0" text-anchor="middle" font-size="13" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#1f2933">Vector search</text>
<text x="340.0" y="174.0" text-anchor="middle" font-size="10.5" fill="#64748b">meaning, not words</text>
<path d="M190,123 L220,123 L220,93 L246,93" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<path d="M190,123 L220,123 L220,161 L246,161" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<rect x="478" y="104" width="150" height="46" rx="9" fill="#fef3c7" stroke="#b45309"/>
<text x="553.0" y="123.0" text-anchor="middle" font-size="13" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#1f2933">RRF fusion</text>
<text x="553.0" y="140.0" text-anchor="middle" font-size="10.5" fill="#64748b">1 / (60 + rank)</text>
<path d="M430,93 L455,93 L455,127 L474,127" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<path d="M430,161 L455,161 L455,127 L474,127" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<rect x="676" y="104" width="184" height="46" rx="9" fill="#d1fae5" stroke="#059669"/>
<text x="768.0" y="123.0" text-anchor="middle" font-size="13" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#1f2933">Cross-encoder</text>
<text x="768.0" y="140.0" text-anchor="middle" font-size="10.5" fill="#64748b">rerank -&gt; top 5</text>
<path d="M628,127 L672,127" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="450" y="224" text-anchor="middle" font-size="12" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#1f2933">BM25 catches literal identifiers an embedding misses (a column called cust_id).</text>
<text x="450" y="244" text-anchor="middle" font-size="12" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#1f2933">Vectors catch meaning BM25 misses ("revenue" finding a table called sales).</text>
<text x="450" y="272" text-anchor="middle" font-size="11.5" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#64748b">Reranking fails OPEN - if the cross-encoder errors, the fused order is used and the answer still ships.</text>
</svg>