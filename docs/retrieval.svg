<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<rect width="900" height="340" rx="14" fill="#ffffff"/>
<rect width="900" height="340" rx="14" fill="none" stroke="#e2e8f0"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
<marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
<marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
</defs>
<text x="24" y="34" font-size="16" font-weight="700" fill="#1f2933">Finding the right data</text>
<text x="24" y="54" font-size="12" fill="#64748b">Two different kinds of search, because each one misses what the other catches.</text>
<rect x="40" y="104" width="154" height="46" rx="9" fill="#dbeafe" stroke="#2563eb"/>
<text x="117.0" y="123.0" text-anchor="middle" font-size="13" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#1f2933">Your question</text>
<text x="117.0" y="140.0" text-anchor="middle" font-size="10.5" fill="#64748b">"our best customers?"</text>
<rect x="254" y="74" width="190" height="46" rx="9" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="349.0" y="93.0" text-anchor="middle" font-size="13" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#1f2933">Keyword search</text>
<text x="349.0" y="110.0" text-anchor="middle" font-size="10.5" fill="#64748b">matches exact names</text>
<rect x="254" y="142" width="190" height="46" rx="9" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="349.0" y="161.0" text-anchor="middle" font-size="13" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#1f2933">Meaning search</text>
<text x="349.0" y="178.0" text-anchor="middle" font-size="10.5" fill="#64748b">matches the idea</text>
<path d="M194,127 L224,127 L224,97 L250,97" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<path d="M194,127 L224,127 L224,165 L250,165" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<rect x="492" y="108" width="150" height="46" rx="9" fill="#fef3c7" stroke="#b45309"/>
<text x="567.0" y="127.0" text-anchor="middle" font-size="13" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#1f2933">Combine both</text>
<text x="567.0" y="144.0" text-anchor="middle" font-size="10.5" fill="#64748b">into one list</text>
<path d="M444,97 L469,97 L469,131 L488,131" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<path d="M444,165 L469,165 L469,131 L488,131" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<rect x="690" y="108" width="170" height="46" rx="9" fill="#d1fae5" stroke="#059669"/>
<text x="775.0" y="127.0" text-anchor="middle" font-size="13" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#1f2933">Keep the best</text>
<text x="775.0" y="144.0" text-anchor="middle" font-size="10.5" fill="#64748b">top five</text>
<path d="M642,131 L686,131" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="450" y="232" text-anchor="middle" font-size="12" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#1f2933">Keyword search finds a table named exactly what you said. Meaning search finds one named</text>
<text x="450" y="250" text-anchor="middle" font-size="12" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#1f2933">something different that means the same thing. Using both catches far more than either alone.</text>
<text x="450" y="284" text-anchor="middle" font-size="11.5" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#64748b">If the final ranking step ever fails, the combined list is used instead - you still get an answer.</text>
</svg>