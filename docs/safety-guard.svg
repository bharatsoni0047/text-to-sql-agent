<text x="292" y="125" text-anchor="middle" font-size="10" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#1f2933">SELECT / WITH?</text>
