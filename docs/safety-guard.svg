<rect x="190" y="210" width="500" height="44" rx="9" fill="#fee2e2" stroke="#dc2626"/>
<text x="440.0" y="236.5" text-anchor="middle" font-size="12" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#1f2933">BLOCKED  -  ValueError, query never reaches the database</text>
<text x="450" y="288" text-anchor="middle" font-size="12" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#1f2933">Fail-closed: anything not provably a single read-only SELECT is refused. Blocking too much is the safe direction.</text>
