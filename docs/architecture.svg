<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<rect width="900" height="430" rx="14" fill="#ffffff"/>
<rect width="900" height="430" rx="14" fill="none" stroke="#e2e8f0"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
<marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
<marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
</defs>
<text x="24" y="34" font-size="16" font-weight="700" fill="#1f2933">How the parts fit together</text>
<text x="24" y="54" font-size="12" fill="#64748b">Four layers. Each one only talks to the one below it.</text>
<rect x="40" y="92" width="820" height="58" rx="9" fill="#ede9fe" stroke="#7c3aed"/>
<text x="450.0" y="125.5" text-anchor="middle" font-size="13" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#1f2933"></text>
<text x="60" y="118" text-anchor="start" font-size="14" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#7c3aed">The front door</text>
<text x="60" y="137" text-anchor="start" font-size="11.5" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#1f2933">The web page you type into, and the login that protects it</text>
<path d="M450,150 L450,164" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<rect x="40" y="168" width="820" height="58" rx="9" fill="#fef3c7" stroke="#b45309"/>
<text x="450.0" y="201.5" text-anchor="middle" font-size="13" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#1f2933"></text>
<text x="60" y="194" text-anchor="start" font-size="14" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#b45309">The thinking part</text>
<text x="60" y="213" text-anchor="start" font-size="11.5" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#1f2933">Decides what to do, drafts the database request, and runs the safety check</text>
<path d="M450,226 L450,240" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<rect x="40" y="244" width="820" height="58" rx="9" fill="#dbeafe" stroke="#2563eb"/>
<text x="450.0" y="277.5" text-anchor="middle" font-size="13" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#1f2933"></text>
<text x="60" y="270" text-anchor="start" font-size="14" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#2563eb">The finder</text>
<text x="60" y="289" text-anchor="start" font-size="11.5" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#1f2933">Works out which of your tables or documents could hold the answer</text>
<path d="M450,302 L450,316" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<rect x="40" y="320" width="820" height="58" rx="9" fill="#d1fae5" stroke="#059669"/>
<text x="450.0" y="353.5" text-anchor="middle" font-size="13" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#1f2933"></text>
<text x="60" y="346" text-anchor="start" font-size="14" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#059669">The connector</text>
<text x="60" y="365" text-anchor="start" font-size="11.5" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#1f2933">Talks to your database and reads your uploaded files</text>
<rect x="40" y="384" width="820" height="30" rx="9" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="450.0" y="403.5" text-anchor="middle" font-size="11.5" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#1f2933">All the settings live in one place. Passwords are never stored in the project.</text>
</svg>